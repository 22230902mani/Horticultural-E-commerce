<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: slideInLeft 0.8s ease-out;
            z-index: 10;
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-100px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .back-btn:hover {
            background: linear-gradient(45deg, #e52e71, #ff8a00);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .back-btn:active {
            transform: translateY(1px) scale(1);
        }

        .contact-container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: scaleUp 0.8s ease-out;
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .contact-left {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-left-title {
            margin-bottom: 10px;
        }

        .contact-left-title h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            animation: fadeInText 1s ease-out 0.3s backwards;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-left-title hr {
            width: 50px;
            height: 4px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            border: none;
            border-radius: 2px;
            margin-top: 5px;
            animation: expandLine 0.8s ease-out 0.5s backwards;
        }

        @keyframes expandLine {
            0% {
                width: 0;
                opacity: 0;
            }
            100% {
                width: 50px;
                opacity: 1;
            }
        }

        .contact-inputs {
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            animation: fadeInInput 0.8s ease-out backwards;
        }

        @keyframes fadeInInput {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-inputs:nth-child(1) { animation-delay: 0.6s; }
        .contact-inputs:nth-child(2) { animation-delay: 0.7s; }
        .contact-inputs:nth-child(3) { animation-delay: 0.8s; }

        .contact-inputs:focus {
            border-color: #ff8a00;
            box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.2);
        }

        textarea.contact-inputs {
            resize: vertical;
            min-height: 120px;
        }

        button[type="submit"] {
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-out 1s backwards;
        }

        button[type="submit"]:hover {
            background: linear-gradient(45deg, #e52e71, #ff8a00);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        button[type="submit"] img {
            width: 20px;
            transition: transform 0.3s ease;
        }

        button[type="submit"]:hover img {
            transform: translateX(5px);
        }

        .contact-right {
            flex: 1;
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .contact-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeInRight 1s ease-out 0.5s backwards;
        }

        @keyframes fadeInRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .contact-container {
                flex-direction: column;
            }
            
            .contact-left, .contact-right {
                padding: 30px;
            }
            
            .back-btn {
                top: 15px;
                left: 15px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">Back</a>

    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
           <div class="contact-left-title">
            <h2>Get in Touch</h2>
            <hr>
           </div>
           <input type="hidden" name="access_key" value="7412b122-a7fb-495a-94ff-f9d3ed8647c8">
           <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
           <input type="email" name="email" placeholder="Your Email" class="contact-inputs" required>
           <textarea name="message" placeholder="Your message" class="contact-inputs" required></textarea>
           <button type="submit">Submit<img src="assets/arrow_icon.png" alt=""></button>
        </form>
        <div class="contact-right">
            <img src="assets/right_img.png" alt="Contact illustration">
        </div>
    </div>
</body>
</html>
